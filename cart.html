<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RideVolt Cart</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
    color:#222;
}

/* HEADER */

header{
    background:#111;
    padding:18px 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #333;
}

.logo{
    color:#ff6a00;
    font-size:24px;
    font-weight:bold;
}

nav{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
}

nav a{
    color:white;
    text-decoration:none;
    font-size:14px;
}

nav a:hover{
    color:#ff6a00;
}


/* HERO */

.hero{
    background:#111;
    color:white;
    text-align:center;
    padding:45px 20px;
}

.hero h1{
    font-size:36px;
    margin-bottom:10px;
}

.hero h1 span{
    color:#ff6a00;
}

.hero p{
    color:#bbb;
}


/* CART SECTION */

.cart-section{
    max-width:1000px;
    margin:40px auto;
    padding:0 20px;
}

.cart-box{
    background:white;
    border-radius:12px;
    padding:25px;
    box-shadow:0 4px 15px rgba(0,0,0,0.10);
}


/* CART ITEM */

.cart-item{
    display:flex;
    align-items:center;
    gap:20px;
    padding:20px 0;
    border-bottom:1px solid #ddd;
}

.cart-item img{
    width:100px;
    height:100px;
    object-fit:cover;
    border-radius:8px;
}

.item-info{
    flex:1;
}

.item-info h3{
    margin-bottom:8px;
    font-size:19px;
}

.item-price{
    color:#ff6a00;
    font-weight:bold;
    margin-bottom:12px;
}


/* QUANTITY */

.quantity-controls{
    display:flex;
    align-items:center;
    gap:10px;
}

.quantity-controls button{
    width:34px;
    height:34px;
    border:none;
    border-radius:5px;
    background:#111;
    color:white;
    font-size:20px;
    cursor:pointer;
}

.quantity-controls button:hover{
    background:#ff6a00;
}

.quantity-number{
    min-width:30px;
    text-align:center;
    font-size:17px;
    font-weight:bold;
}


/* RIGHT SIDE */

.item-right{
    text-align:right;
    min-width:130px;
}

.item-total{
    font-size:18px;
    font-weight:bold;
    margin-bottom:12px;
}


/* DELETE */

.delete-btn{
    border:none;
    background:#e53935;
    color:white;
    padding:8px 13px;
    border-radius:5px;
    cursor:pointer;
    font-weight:bold;
}

.delete-btn:hover{
    background:#c62828;
}


/* TOTAL */

.cart-total{
    text-align:right;
    padding-top:25px;
}

.cart-total h2{
    margin-bottom:20px;
}


/* BUTTONS */

.cart-buttons{
    display:flex;
    justify-content:flex-end;
    gap:12px;
    flex-wrap:wrap;
}

.clear-btn{
    border:none;
    background:#222;
    color:white;
    padding:13px 20px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.clear-btn:hover{
    background:#444;
}

.checkout-btn{
    display:inline-block;
    background:#ff6a00;
    color:white;
    text-decoration:none;
    padding:13px 20px;
    border-radius:6px;
    font-weight:bold;
}

.checkout-btn:hover{
    background:#e85f00;
}


/* EMPTY CART */

.empty{
    text-align:center;
    padding:50px 20px;
}

.empty h2{
    margin-bottom:12px;
}

.empty p{
    color:#777;
    margin-bottom:25px;
}

.shop-btn{
    display:inline-block;
    background:#ff6a00;
    color:white;
    text-decoration:none;
    padding:12px 22px;
    border-radius:6px;
    font-weight:bold;
}


/* FOOTER */

footer{
    background:#111;
    color:#999;
    text-align:center;
    padding:25px;
    margin-top:80px;
}

footer strong{
    color:#ff6a00;
}


/* MOBILE */

@media(max-width:700px){

    header{
        flex-direction:column;
        gap:15px;
    }

    nav{
        justify-content:center;
        gap:15px;
    }

    .cart-item{
        align-items:flex-start;
        flex-wrap:wrap;
    }

    .cart-item img{
        width:80px;
        height:80px;
    }

    .item-info{
        min-width:180px;
    }

    .item-right{
        width:100%;
        text-align:left;
        margin-top:5px;
    }

    .cart-buttons{
        justify-content:center;
    }

}

</style>

</head>


<body>


<!-- HEADER -->

<header>

    <div class="logo">
        RideVolt
    </div>

    <nav>

        <a href="index.html">Home</a>

        <a href="products.html">Products</a>

        <a href="about.html">About</a>

        <a href="blog.html">Blog</a>

        <a href="reviews.html">Reviews</a>

        <a href="contact.html">Contact</a>

        <a href="cart.html">🛒 Cart</a>

    </nav>

</header>


<!-- HERO -->

<section class="hero">

    <h1>
        Your <span>Cart</span>
    </h1>

    <p>
        Review and manage your RideVolt gear.
    </p>

</section>


<!-- CART -->

<section class="cart-section">

    <div class="cart-box" id="cartBox">

    </div>

</section>


<!-- FOOTER -->

<footer>

    <p>
        © 2026 <strong>RideVolt</strong>.
        Gear Up. Ride Further.
    </p>

</footer>


<script>

/* GET CART */

function getCart(){

    let cart =
        JSON.parse(localStorage.getItem("ridevoltCart"));

    if(!Array.isArray(cart)){

        cart = [];

    }

    return cart;

}


/* SAVE CART */

function saveCart(cart){

    localStorage.setItem(
        "ridevoltCart",
        JSON.stringify(cart)
    );

}


/* DISPLAY CART */

function displayCart(){

    const cartBox =
        document.getElementById("cartBox");

    const cart =
        getCart();


    /* EMPTY */

    if(cart.length === 0){

        cartBox.innerHTML = `

            <div class="empty">

                <h2>
                    Your Cart is Empty
                </h2>

                <p>
                    Add some RideVolt gear to your cart.
                </p>

                <a
                href="products.html"
                class="shop-btn">

                    Continue Shopping

                </a>

            </div>

        `;

        return;

    }


    let total = 0;

    let itemsHTML = "";


    /* EACH PRODUCT */

    cart.forEach(function(product,index){

        const quantity =
            Number(product.quantity) || 1;

        const price =
            Number(product.price) || 0;

        const itemTotal =
            price * quantity;

        total += itemTotal;


        itemsHTML += `

            <div class="cart-item">

                <img
                src="${product.image}"
                alt="${product.name}">


                <div class="item-info">

                    <h3>
                        ${product.name}
                    </h3>

                    <div class="item-price">
                        ₹${price.toLocaleString("en-IN")}
                    </div>


                    <div class="quantity-controls">

                        <button
                        onclick="changeQuantity(${index},-1)">
                            −
                        </button>

                        <span class="quantity-number">
                            ${quantity}
                        </span>

                        <button
                        onclick="changeQuantity(${index},1)">
                            +
                        </button>

                    </div>

                </div>


                <div class="item-right">

                    <div class="item-total">
                        ₹${itemTotal.toLocaleString("en-IN")}
                    </div>

                    <button
                    class="delete-btn"
                    onclick="deleteItem(${index})">

                        🗑 Delete

                    </button>

                </div>

            </div>

        `;

    });


    /* TOTAL */

    cartBox.innerHTML = `

        ${itemsHTML}


        <div class="cart-total">

            <h2>
                Total:
                ₹${total.toLocaleString("en-IN")}
            </h2>


            <div class="cart-buttons">

                <button
                class="clear-btn"
                onclick="clearCart()">

                    Clear Cart

                </button>


                <a
                href="checkout.html"
                class="checkout-btn">

                    Proceed to Checkout

                </a>

            </div>

        </div>

    `;

}


/* PLUS / MINUS */

function changeQuantity(index,change){

    let cart =
        getCart();


    if(!cart[index]){
        return;
    }


    let quantity =
        Number(cart[index].quantity) || 1;


    quantity =
        quantity + change;


    /* DO NOT GO BELOW 1 */

    if(quantity < 1){

        quantity = 1;

    }


    cart[index].quantity =
        quantity;


    saveCart(cart);

    displayCart();

}


/* DELETE ONE PRODUCT */

function deleteItem(index){

    let cart =
        getCart();


    if(!cart[index]){
        return;
    }


    cart.splice(index,1);


    saveCart(cart);

    displayCart();

}


/* CLEAR ENTIRE CART */

function clearCart(){

    localStorage.removeItem("ridevoltCart");

    displayCart();

}


/* START */

displayCart();

</script>


</body>

</html>
